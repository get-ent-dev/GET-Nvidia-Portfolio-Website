# frontend/Cargo.toml

[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
# stylist = { version = "0.13", features = ["yew"] } # COMMENT THIS LINE OUT

gloo-render = "0.2"
gloo-utils = "0.2"
gloo-console = "0.2"

wasm-bindgen = "0.2"

web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Element",
    "History",
] }

wasm-logger = "0.2"
