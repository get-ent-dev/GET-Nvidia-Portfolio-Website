<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GET Nvidia Portfolio</title>
    <link rel="icon" href="/assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Basic resets and black/white theme */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* Black background */
            color: #FFF; /* White text */
            overflow-x: hidden; /* Prevent horizontal scroll for parallax */
        }
        a {
            color: #FFF;
            text-decoration: none;
        }
        a:hover {
            color: #AAA; /* Subtle hover effect */
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Behind other content */
        }
        #app {
            position: relative;
            z-index: 1; /* Above canvas */
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <canvas id="webgl-canvas"></canvas>
    <script type="module">
        import init from './pkg/frontend.js';
        async function run() {
            await init();
        }
        run();
    </script>
</body>
</html>
